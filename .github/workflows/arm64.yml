name: arm64

# Manual only -- start it from the Actions tab, or `gh workflow run arm64.yml`.
on:
  workflow_dispatch:

jobs:
  build:
    # Native Windows-on-Arm runner, so the ARM64 binary runs without emulation.
    # Pin to `windows-11-vs2026-arm` instead if this label is still on the VS 2022 image.
    runs-on: windows-11-arm

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up build environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
                  -property installationPath
          if (-not $vs) { throw "no Visual Studio install with ARM64 C++ tools" }

          # The project pins v145 (VS 2026); fall back to v143 on the VS 2022 image.
          $tools = Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt"
          $toolset = if ([version]$tools -ge [version]'14.50') { 'v145' } else { 'v143' }

          $msbuild = "$vs\MSBuild\Current\Bin\arm64\MSBuild.exe"
          if (-not (Test-Path $msbuild)) { $msbuild = "$vs\MSBuild\Current\Bin\MSBuild.exe" }

          Write-Host "vs       = $vs"
          Write-Host "msvc     = $tools"
          Write-Host "toolset  = $toolset"
          Write-Host "msbuild  = $msbuild"

          "MSBUILD=$msbuild" | Out-File $env:GITHUB_ENV -Append
          "TOOLSET=$toolset" | Out-File $env:GITHUB_ENV -Append

      - name: Build
        shell: pwsh
        run: |
          & $env:MSBUILD armcall.vcxproj `
            -p:Configuration=Release -p:Platform=ARM64 `
            -p:PlatformToolset=$env:TOOLSET `
            -m -v:m -nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run
        shell: pwsh
        run: |
          Write-Host "host arch: $env:PROCESSOR_ARCHITECTURE"
          .\ARM64\Release\armcall.exe
          if ($LASTEXITCODE -ne 0) { throw "armcall.exe exited with $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: armcall-arm64
          path: |
            ARM64\Release\armcall.exe
            ARM64\Release\armcall.pdb
